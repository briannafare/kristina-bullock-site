name: Render Remotion Videos

on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths:
      - "src/remotion/**"
      - "public/images/**"
      - "public/headshot.jpg"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create output directory
        run: mkdir -p public/videos

      - name: Render BrandHero (16:9)
        run: npx remotion render src/remotion/index.tsx BrandHero --output public/videos/brand-hero.mp4 --codec h264

      - name: Render BrandHero Portrait (9:16)
        run: npx remotion render src/remotion/index.tsx BrandHeroPortrait --output public/videos/brand-hero-portrait.mp4 --codec h264

      - name: Render BrandHero Square (1:1)
        run: npx remotion render src/remotion/index.tsx BrandHeroSquare --output public/videos/brand-hero-square.mp4 --codec h264

      - name: Render TestimonialReel (16:9)
        run: npx remotion render src/remotion/index.tsx TestimonialReel --output public/videos/testimonial-reel.mp4 --codec h264

      - name: Render TestimonialReel Portrait (9:16)
        run: npx remotion render src/remotion/index.tsx TestimonialReelPortrait --output public/videos/testimonial-reel-portrait.mp4 --codec h264

      - name: Render StatHighlight (16:9)
        run: npx remotion render src/remotion/index.tsx StatHighlight --output public/videos/stat-highlight.mp4 --codec h264

      - name: Commit rendered videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/videos/*.mp4
          if git diff --cached --quiet; then
            echo "No new video files to commit"
          else
            git commit -m "ci: render Remotion videos [skip ci]"
            git push
          fi
